<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог туристичних місць</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="container mt-4">


<h2 class="text-center">Каталог картин</h2>
<a href="/pictures/add" class="btn btn-primary mb-3"> <i class="bi bi-bookmark-plus"></i> Додати картину</a>

<table class="table table-striped text-center">
    <thead>
    <tr>
        <th>Зображення</th>
        <th>Назва</th>
        <th>Автор</th>
        <th>Дії</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="picture : ${pictures}">
        <td>
            <img th:src="${picture.image_url}" alt="Зображення" class="picture-img" style="width: 100px;">
        </td>
        <td th:text="${picture.name}"></td>
        <td th:text="${picture.author}"></td>
        <td>
            <a th:href="@{/pictures/edit/{id}(id=${picture.id})}" class="btn btn-warning"><i class="bi bi-pencil-square"></i>Редагувати</a>

            <a th:href="@{/pictures/delete/{id}(id=${picture.id})}" class="btn btn-danger"><i class="bi bi-trash"></i>
                Видалити
            </a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
